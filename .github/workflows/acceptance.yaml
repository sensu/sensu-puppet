name: Acceptance

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    # Items marked as ci_build=yes are allowed to fail
    continue-on-error: ${{ matrix.ci_build == 'yes' }}
    strategy:
      fail-fast: false
      matrix:
        set:
        - rocky-9-modern
        - debian-12-modern
        - ubuntu-24.04-modern
        - ubuntu-22.04-modern
        - almalinux-9-modern
        puppet:
        - puppet7
        - puppet8
        ci_build:
        - no
        exclude:
        - puppet: puppet7
          ci_build: yes
        - puppet: puppet8
          ci_build: yes
    env:
      BEAKER_debug: true
    name: ${{ matrix.set }} ${{ matrix.puppet }} (ci=${{ matrix.ci_build }})
    steps:
    - uses: actions/checkout@v2
    - name: Setup ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1.4'
        bundler-cache: true
        bundler: '2.4.10'
    - name: Decrypt secrets
      env:
        SENSU_SECRETS_PASSWORD: ${{ secrets.SENSU_SECRETS_PASSWORD }}
      if: ${{ env.SENSU_SECRETS_PASSWORD != null }}
      run: ./tests/decrypt-secrets.sh
    - name: Run tests
      run: bundle exec rake acceptance
      env:
        RUN_ACCEPTANCE: 1
        BEAKER_PUPPET_COLLECTION: ${{ matrix.puppet }}
        BEAKER_set: ${{ matrix.set }}
        BEAKER_sensu_mode: base
        BEAKER_sensu_use_agent: no
        BEAKER_sensu_ci_build: ${{ matrix.ci_build }}
