name: Acceptance

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Items marked as ci_build=yes are allowed to fail
    continue-on-error: ${{ matrix.ci_build == 'yes' }}
    strategy:
      fail-fast: false
      matrix:
        set:
        - rocky-9
        - debian-12
        - ubuntu-24.04
        - ubuntu-22.04
        - almalinux-9
        puppet:
        - puppet8
        ci_build:
        - no
        exclude:
        - puppet: puppet8
          ci_build: yes
    env:
      BEAKER_debug: false
    name: ${{ matrix.set }} ${{ matrix.puppet }} (ci=${{ matrix.ci_build }})
    steps:
    - uses: actions/checkout@v7
    - name: Setup ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler-cache: true
    - name: Decrypt secrets
      env:
        SENSU_SECRETS_PASSWORD: ${{ secrets.SENSU_SECRETS_PASSWORD }}
      if: ${{ env.SENSU_SECRETS_PASSWORD != null }}
      run: ./tests/decrypt-secrets.sh
    - name: Restore Docker image cache
      uses: actions/cache@v6
      with:
        path: /tmp/.docker-cache
        key: docker-${{ matrix.set }}-${{ hashFiles(format('spec/acceptance/nodesets/{0}.yml', matrix.set)) }}
        restore-keys: docker-${{ matrix.set }}-
    - name: Load cached Docker images
      run: |
        if [ -d /tmp/.docker-cache ]; then
          for f in /tmp/.docker-cache/*.tar; do [ -f "$f" ] && docker load -i "$f" || true; done
        fi
    - name: Run tests
      run: bundle exec rake acceptance
      env:
        RUN_ACCEPTANCE: 1
        BEAKER_set: ${{ matrix.set }}
        BEAKER_PUPPET_COLLECTION: puppet8
        BEAKER_sensu_mode: base
        BEAKER_sensu_use_agent: no
        BEAKER_sensu_ci_build: ${{ matrix.ci_build }}
    - name: Save Docker images to cache
      if: always()
      run: |
        mkdir -p /tmp/.docker-cache
        docker images --format '{{.Repository}}:{{.Tag}}' | grep '^sensu-' | \
          xargs -I{} sh -c 'docker save {} -o /tmp/.docker-cache/$(echo {} | tr "/:." "_").tar' || true
